[project]
name = "graphrag-dlp"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pyjwt[crypto]>=2.9,<3", "lark>=1.2,<2", "httpx>=0.27,<1", "neo4j>=5.26,<6"]
[project.optional-dependencies]
providers = ["langgraph>=0.2,<2", "flashrank>=0.2.9,<1"]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
