name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Verify pyproject.toml exists
        run: |
          if [ ! -f "pyproject.toml" ]; then
            echo "ERROR: pyproject.toml not found in repository root." >&2
            exit 1
          fi

      - name: Install dependencies (reproducible with test extra)
        run: uv sync --extra test --frozen || uv sync --extra test

      - name: Python syntax check
        run: python3 -m compileall -q backend/

      - name: Run pytest (serial, bounded)
        run: uv run pytest -v -o "addopts=" --override-ini="addopts="

  frontend-checks:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend package.json exists
        run: |
          if [ ! -f "frontend/package.json" ]; then
            echo "ERROR: frontend/package.json not found." >&2
            exit 1
          fi

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Build and typecheck frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
